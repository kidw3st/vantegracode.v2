# Превью сайта на GitHub Pages: https://kidw3st.github.io/vantegracode.v2/
# При каждом пуше в main собирает сайт под подпапку (tools/pages-build.mjs)
# и публикует dist/ в ветку gh-pages. Превью закрыто от поисковиков, форма в нём имитируется.
name: Превью на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Сборка превью
        run: node tools/pages-build.mjs

      - name: Публикация в gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages
            git worktree add /tmp/site origin/gh-pages
          else
            git worktree add --detach /tmp/site
            git -C /tmp/site checkout --orphan gh-pages
          fi
          git -C /tmp/site rm -rf --quiet . || true
          cp -a dist/. /tmp/site/
          git -C /tmp/site add -A
          if git -C /tmp/site diff --cached --quiet; then
            echo "Изменений нет"
          else
            git -C /tmp/site commit -m "Превью: ${GITHUB_SHA::7}"
            git -C /tmp/site push origin HEAD:gh-pages
          fi
