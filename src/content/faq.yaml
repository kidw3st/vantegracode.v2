# Вопросы и ответы. Ответы — дословно из задания; {…} подставляются из src/data/site.ts и prices.yaml.
# group: money — «Стоимость и сроки», process — «Процесс», after — «После запуска».
# tags — для выборки на страницах услуг (faqTags).

- id: stoimost
  order: 1
  group: money
  q: Сколько стоит разработка?
  a: "Зависит от объёма, логики и интеграций. Ориентиры — на странице «Цены». Точную смету называем после короткого созвона, когда понятна задача."
  tags: [money]

- id: sroki
  order: 2
  group: money
  q: Сколько времени занимает проект?
  a: "Лендинг — от {term:landing}, корпоративный сайт — от {term:corporate}, веб-приложение — от {term:webapp}. Точный срок фиксируем в смете и договоре."
  tags: [money, sajty]

# Владельцу: проверьте формулировку (в задании помечено «проверь»)
- id: rost-ceny
  order: 3
  group: money
  q: Может ли цена вырасти в процессе?
  a: "Нет, если не меняется объём. Новые задачи оцениваем отдельно и согласуем до начала работ."
  tags: [money]

- id: oplata
  order: 4
  group: money
  q: Как проходит оплата?
  a: "{payment}. Работаем по договору, закрывающие документы — {closingDocs}."
  tags: [money]

- id: start
  order: 5
  group: process
  q: С чего начинается работа?
  a: "С короткого созвона: обсуждаем цели, сроки и бюджет. Затем присылаем смету и план, подписываем договор и стартуем."
  tags: [process]

- id: ot-vas
  order: 6
  group: process
  q: Что нужно от нас?
  a: "Контактное лицо, которое принимает решения, доступы к текущим сервисам, материалы — логотип, тексты, фото — и обратная связь по этапам."
  tags: [process]

- id: kontrol
  order: 7
  group: process
  q: Можно следить за процессом?
  a: "Да. Показываем промежуточный результат {demoFrequency} и ведём общий чат проекта."
  tags: [process]

- id: goroda
  order: 8
  group: process
  q: Работаете с другими городами?
  a: "Да, работаем удалённо по всей России. Встречи — по видеосвязи."
  tags: [process]

- id: nda
  order: 9
